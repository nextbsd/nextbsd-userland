name: build-arch (reusable per-arch pipeline)

# Reusable per-arch lane: build the Darwin system layer -> assemble the native
# CI .img -> (optionally) boot-test it. build.yml calls this ONCE PER ARCH, so
# each arch is a fully independent pipeline: amd64's boot starts the instant
# amd64's build finishes, in parallel with arm64 — there is no cross-arch matrix
# barrier (a `needs:` on a matrix job would wait for ALL legs; separate called
# workflows do not).
#
# Cross-builds Tier 0-2 only (see README); both arches cross-build on the x86_64
# runner via the per-arch nextbsd-toolchain image.

on:
  workflow_call:
    inputs:
      arch:
        description: 'amd64 | arm64'
        required: true
        type: string
      target_arch:
        description: 'amd64 | aarch64 (FreeBSD TARGET_ARCH)'
        required: true
        type: string
      boot:
        description: 'run the qemu boot test for this arch (PR only)'
        required: false
        default: false
        type: boolean
      boot_runner:
        description: 'runner for the boot job (amd64 -> ubuntu-24.04; arm64 -> ubuntu-24.04-arm for native KVM)'
        required: false
        default: 'ubuntu-24.04'
        type: string
      boot_soft:
        description: 'non-gating boot: a boot failure WARNs but does not fail the lane (first arm64 bring-up)'
        required: false
        default: false
        type: boolean
      boot_gate:
        description: 'full = boot + on-image test suite (amd64); login = boot to the login: prompt then exit (arm64, while post-login aarch64 hang is fixed)'
        required: false
        default: 'full'
        type: string
      harness_ref:
        description: 'nextbsd/nextbsd-ci ref this lane checks out (T4): the shared image assembly (scripts/assemble-image.sh) AND the boot harness. Pinned to the release tag the 4-repo lockstep lands on, so neither drifts with nextbsd-ci main.'
        required: false
        default: 'v0.3.6'
        type: string
      fbsd_sha:
        description: 'pinned FreeBSD SHA for the toolchain image tag (blank = latest)'
        required: false
        default: ''
        type: string

jobs:
  userland:
    name: userland (${{ inputs.arch }})
    runs-on: ubuntu-24.04
    container:
      # Per-arch toolchain image: clang cross-compiler at $CROSS_BINDIR,
      # FreeBSD /usr/src + make.py, and the baked kernel-toolchain.
      image: ghcr.io/nextbsd/nextbsd-toolchain:${{ inputs.arch }}-${{ inputs.fbsd_sha && format('fbsd-{0}', inputs.fbsd_sha) || 'latest' }}
    steps:
      - uses: actions/checkout@v4

      # mach_port.defs lives in nextbsd-kernel, deliberately: it describes the
      # WIRE, and a wire needs exactly one description or the two ends drift --
      # which is the failure nextbsd-kernel#125 exists to remove. The kernel
      # generates its server from this same file; we generate the libmach
      # client from it. Symmetric with nextbsd-kernel's own build, which checks
      # out THIS repo to build migcom.
      - name: Checkout nextbsd-kernel (mach_port.defs for the libmach client)
        uses: actions/checkout@v4
        with:
          repository: nextbsd/nextbsd-kernel
          ref: main
          path: .kernel

      # (A) Stage the cross SYSROOT from compat's `continuous` base — the built
      #     libc/libsys/libs (+ headers) the Darwin stack links against. HARD
      #     dependency: userland is downstream of compat.
      - name: Stage sysroot from compat continuous
        env:
          # Public cross-repo READ (compat's `continuous` base asset) — needs no
          # PAT. The built-in github.token authenticates gh for public reads and,
          # unlike secrets.DISPATCH_TOKEN, is present on fork PRs (forks get a
          # read-only github.token but never repo secrets). See #58 in
          # nextbsd-kernel: the PAT stays only on the repository_dispatch step.
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/sysroot"
          gh release download continuous \
            --repo nextbsd/nextbsd-freebsd-compat \
            --pattern "nextbsd-base-${{ inputs.arch }}.tar.gz" \
            --output /tmp/base.tar.gz --clobber
          tar -C "$GITHUB_WORKSPACE/sysroot" -xzf /tmp/base.tar.gz

      # (A2) Host build deps the toolchain image doesn't ship: the two CMake
      #      components (libdispatch, swift-foundation-icu) need cmake/ninja on
      #      the BUILD host. bison/flex/gcc/bmake are already in the image.
      - name: Install host build deps (cmake/ninja for the CMake components)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends cmake ninja-build

      # (B) Cross-build Tiers 0-2 into /stage. build-userland.sh enters
      #     `make.py buildenv` per component (reusing the baked kernel-toolchain
      #     — no rebuild) and owns the dependency order.
      - name: Build Darwin system layer into /stage
        env:
          T: ${{ inputs.arch }}
          TA: ${{ inputs.target_arch }}
          SYSROOT: ${{ github.workspace }}/sysroot
          DESTDIR: /stage
        run: |
          chmod +x ./build-userland.sh
          ./build-userland.sh

      # (D) Pack — raw tar of /stage rooted at / (so /usr/lib/system, /sbin,
      #     /usr/sbin, /usr/include, /usr/tests). nextbsd extracts it over the base.
      - name: Pack userland artifact
        run: |
          rm -f /stage/METALOG
          # Bundle the authoritative overlay INTO the artifact so the published
          # tarball — and thus the NextBSD-userland package — is a COMPLETE,
          # bootable userland: the 11 /System/Library/LaunchDaemons plists, the
          # /private/etc bootstrap (master.passwd, nsswitch, login.conf, pam.d,
          # rc.d, ssh), boot/loader.conf.d, and usr/tests drivers. Consumers no
          # longer apply a separate overlay — they only do the Apple /private
          # symlink layout + pwd_mkdb/cap_mkdb finalization at assembly time.
          # Relative path (CWD is the checkout root, as ./build-userland.sh
          # above relies on) — ${{ github.workspace }} is the host path and does
          # not exist inside the build container (workspace is mounted at /__w).
          cp -aR overlay/. /stage/
          # master.passwd must be 0600 (git can't store sub-0644 modes); the
          # /etc symlink is created by the consumer's apple_private_layout.
          [ -f /stage/private/etc/master.passwd ] && chmod 0600 /stage/private/etc/master.passwd
          # (placeholder) re-apply setuid bits the unprivileged cross-install
          # drops — none in the Tier 0-2 system layer today.
          tar -C /stage -czf "/tmp/nextbsd-userland-${{ inputs.arch }}.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: nextbsd-userland-${{ inputs.arch }}
          path: /tmp/nextbsd-userland-${{ inputs.arch }}.tar.gz

      # --- Phase 1: native image assembly, folded into this job (PR) ---
      # Assemble the bootable .img right here: the base sysroot is already
      # downloaded (/tmp/base.tar.gz) and the userland layer is freshly built
      # (/tmp/nextbsd-userland-<arch>.tar.gz), so we avoid re-fetching the base
      # AND the userland artifact upload/download round-trip — only kernel +
      # modules (which this job lacks) are fetched. The image is uploaded for the
      # separate qemu boot job (needs a non-container KVM runner). Runs for both
      # arches (assemble-image.sh handles arm64's UEFI-only mkimg); overlay is
      # vendored at ./overlay.
      - name: Checkout shared assembly + boot harness (nextbsd-ci, pinned)
        uses: actions/checkout@v4
        with:
          repository: nextbsd/nextbsd-ci
          ref: ${{ inputs.harness_ref }}
          path: nextbsd-ci

      - name: Assemble disk.img (shared nextbsd-ci assembly)
        if: github.event_name == 'pull_request'
        env:
          # This step only READS public `continuous` assets from sibling repos
          # (kernel, kernel-modules) and the public nextbsd-overlays tarball, so
          # it needs no PAT — the built-in github.token authenticates gh for
          # public cross-repo reads. Using it (not secrets.DISPATCH_TOKEN) is
          # what lets fork PRs build: forks never receive repo secrets, so
          # DISPATCH_TOKEN was empty and `gh api` exited 4; forks DO get a
          # read-only github.token. Mirrors nextbsd-kernel#58.
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ inputs.arch }}
          BASE_TGZ: /tmp/base.tar.gz
          KERNEL_TGZ: ${{ github.workspace }}/art/nextbsd-kernel-${{ inputs.arch }}.tar.gz
          USERLAND_TGZ: /tmp/nextbsd-userland-${{ inputs.arch }}.tar.gz
          CONTRIB_TGZ: ${{ github.workspace }}/art/nextbsd-contrib-${{ inputs.arch }}.tar.gz
          OVERLAY: ${{ github.workspace }}/overlay
          WORK: ${{ github.workspace }}/nbimg
        run: |
          mkdir -p art
          gh release download continuous -R nextbsd/nextbsd-kernel \
            --pattern 'nextbsd-kernel-${{ inputs.arch }}.tar.gz' --dir art --clobber
          # Third-party base programs (sudo, zsh, pico) from nextbsd-contrib, so
          # the boot test's SUDO check runs against the real image layout.
          gh release download continuous -R nextbsd/nextbsd-contrib \
            --pattern 'nextbsd-contrib-${{ inputs.arch }}.tar.gz' --dir art --clobber
          # Kext tarballs are per-arch: graphics-kexts-<arch>, and on amd64 only
          # freebsd-kexts-amd64 (IntelWiFi, IntelEthernet; nextbsd/nextbsd#554)
          # and nvidia-kexts-amd64. assemble-image.sh extracts every tarball into the
          # same /System/Library/Extensions in `ls` order, so last wins: an
          # unfiltered '*kext*.tar.gz' once laid x86-64 objects over arm64's
          # ("Exec format error"). The stale arch-less graphics-kexts.tar.gz
          # this lane also fetched on amd64 sorted after graphics-kexts-amd64
          # and replaced it; it is deleted (nextbsd/nextbsd#550).
          # Every kext asset must be there: a missing one fails the lane
          # instead of booting an image without it (nextbsd/nextbsd#552).
          gh release download continuous -R nextbsd/nextbsd-kernel-extensions-graphics \
            --pattern "graphics-kexts-${ARCH}.tar.gz" --dir art --clobber
          if [ "$ARCH" = amd64 ]; then
            gh release download continuous -R nextbsd/nextbsd-kernel-extensions \
              --pattern 'freebsd-kexts-amd64.tar.gz' --dir art --clobber
            # NVIDIA (amd64-only) comes from its own repo (nextbsd/nextbsd#548).
            gh release download continuous -R nextbsd/nextbsd-kernel-extensions-nvidia \
              --pattern 'nvidia-kexts-amd64.tar.gz' --dir art --clobber
          fi
          # NOTE (arm64 VirtIOGraphics, was nextbsd-kernel#170): the arm64
          # graphics set ships RAW, VirtIOGraphics.kext included. The old
          # consumer-side strip (re-tar without the bundle) is gone: the
          # kernel-side fix landed (#252 restored the base vgpu driver plus
          # patch 0058's vt_deallocate, which stops the DRM probe evicting the
          # only console), and the continuous artifact carries the bundle. The
          # boot test below is the arbiter -- if the eviction regresses, this
          # lane fails at the prompt, exactly as it should.
          export MODULES_TGZ="$(ls art/*kext*.tar.gz 2>/dev/null | tr '\n' ' ')"
          echo "kexts for ${ARCH}: ${MODULES_TGZ:-<none>}"
          # pkg-free /etc seed: fetch nextbsd-overlays via the API (no git needed
          # in the container) so the stripped userland package's missing /etc is
          # seeded, exactly like nextbsd/build.sh does for the real image.
          gh api repos/nextbsd/nextbsd-overlays/tarball/main > /tmp/overlays.tar.gz
          mkdir -p "$WORK/seed"
          tar -C "$WORK/seed" --strip-components=1 -xzf /tmp/overlays.tar.gz
          export SEED_ROOTFS="$WORK/seed/rootfs"
          # The SHARED assembly (nextbsd-ci, checked out above at the pinned
          # release tag) replaces this lane's old private ci/ copy: one recipe
          # for every consumer (nextbsd, userland, kext lane).
          sh nextbsd-ci/scripts/assemble-image.sh

      - name: Upload native-assembled image
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nextbsd-ci-image-${{ inputs.arch }}
          path: nbimg/out/disk.img

  boot:
    name: ci-image-boot (${{ inputs.arch }}, qemu)
    needs: userland
    # This lane's boot waits ONLY on this lane's build — the other arch's build
    # is a separate called-workflow instance and never blocks it.
    if: ${{ inputs.boot && github.event_name == 'pull_request' }}
    # amd64: ubuntu-24.04 (x86). arm64: ubuntu-24.04-arm so qemu-system-aarch64
    # can KVM-boot the aarch64 image natively (free on public repos); TCG is the
    # fallback if /dev/kvm is absent.
    runs-on: ${{ inputs.boot_runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4          # userland repo: workspace root; the image artifact lands here
      # T4: the shared boot harness, pinned to the release tag (harness_ref,
      # v0.3.6) the 4-repo lockstep lands on. The in-repo tests/boot-test.sh
      # fork (73 KB) stays in the tree as the fallback but is no longer the gate
      # — the shared nextbsd-ci harness is (one loader contract, one sentinel
      # protocol, one audited marker manifest, every repo). Pinning a tag (not
      # main) is what keeps this lane from drifting with harness development.
      # v0.3.5 = v0.3.4 plus the T8 flake fixes (nextbsd#428 end-state hold,
      # nextbsd#503 teardown rc + hard fail, nextbsd#405 marker protocol doc).
      # v0.3.6 adds the KERNEL-BUILD-ID check to assemble-image.sh: the image
      # refuses kexts built for a different kernel (nextbsd#549).
      # The assembled image ships the graphics kexts RAW (the stale #170 arm64
      # VirtIOGraphics strip is gone — the kernel-side fix landed in #252/patch
      # 0058), so this boot also validates that.
      - uses: actions/checkout@v4
        with:
          repository: nextbsd/nextbsd-ci
          ref: ${{ inputs.harness_ref }}
          path: nextbsd-ci
      - uses: actions/download-artifact@v4
        with:
          name: nextbsd-ci-image-${{ inputs.arch }}
          path: .
      - name: Install qemu + expect + UEFI firmware (expect provides tclsh)
        run: |
          sudo apt-get update
          if [ "${{ inputs.arch }}" = arm64 ]; then
            sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-efi-aarch64 expect
          else
            sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf expect
          fi
      # The shared harness boots the native-assembled image, applies the loader
      # contract, logs in, runs the on-image suite(s) from NB_SUITE, and gates
      # on the sentinel: exit 0 = clean, 1 = a must-pass marker/verdict failed,
      # 2 = a hang (re-gated below regardless of boot_soft).
      #
      # NB_SUITE is the launchd-mach suite ONLY for now: the nextbsd-iokit suite
      # is currently SILENT in a real boot (the csh `r` no-ops — zero markers, no
      # NEXTBSD-TEST-SUMMARY), and the shared harness exits 2 on a suite that
      # never prints its sentinel. iokit adds nothing today (0 markers seen); it
      # rejoins NB_SUITE when the silence is fixed. NB_DEBUG=1 for this validation
      # pass: on any timeout/EOF it dumps the transcript tail so a real-image
      # mismatch is diagnosable from the log.
      - name: Boot test (shared nextbsd-ci harness, Darwin+Mach gate)
        id: boot
        continue-on-error: ${{ inputs.boot_soft }}
        env:
          ARCH: ${{ inputs.arch }}
          NB_SUITE: /usr/tests/freebsd-launchd-mach/run.sh
          NB_OVERLAY: nextbsd-ci/manifest/overlay-nextbsd-userland.tsv
          NB_DEBUG: '1'
        run: |
          set +e
          sh nextbsd-ci/harness/boot-test.sh disk.img
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc
      # A boot that never completes is not the same as an assertion that fails,
      # and boot_soft must not report it as success. boot-test.sh exits 2 for
      # the two "never got there" timeouts (no banner, no login prompt); every
      # other failure keeps exit 1 and stays soft.
      #
      # This is not the gate #87 asks for -- marker failures are still hidden.
      # It closes the one hole where a hang is indistinguishable from a clean
      # boot in the reported status. #117 hung for 8 minutes on both arches and
      # `gh pr checks` said `pass`; the only clue was the job taking 10m2s
      # instead of 1m37s.
      - name: Fail on a boot hang, even when boot_soft
        if: always() && steps.boot.outputs.rc == '2'
        run: |
          echo "BOOT-GATE-FAIL: the VM never reached a login banner or prompt."
          echo "  boot-test.sh exited 2 (hang/timeout), which gates regardless"
          echo "  of boot_soft. See the uploaded boot log for the last console"
          echo "  output before it went quiet."
          exit 1
      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-image-boot-log-${{ inputs.arch }}
          path: tests/boot.log
