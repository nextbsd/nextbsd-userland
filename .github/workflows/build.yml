name: Build NextBSD Userland (Darwin system layer)

# Cross-builds the Darwin system layer (Mach / launchd / configd / CoreFoundation
# / IOKit + daemons) on an Ubuntu host with the nextbsd-kernel-toolchain clang
# cross-compiler. REUSES the image's baked kernel-toolchain via `buildenv`
# (no per-run toolchain rebuild). Publishes a rolling `continuous` userland
# artifact that the nextbsd ISO assembler ingests.
#
# Structure: each arch is an INDEPENDENT lane (build -> assemble -> boot) via the
# reusable build-arch.yml, called once per arch below. amd64's boot test starts
# the moment amd64's build finishes — it does NOT wait for arm64's build (and
# vice-versa). `publish` fans in after both lanes.
#
# Scope: Tier 0-2 only (see README) — NO POSIX command suites (those come from
# FreeBSD via nextbsd-freebsd-compat's srclist) and NO PAM (a later pass).
# amd64 + arm64, both cross-built on the x86_64 runner.

on:
  repository_dispatch:
    types: [base-updated]        # from nextbsd-freebsd-compat after its base `continuous` refresh
  pull_request:
    paths: ['src/**', 'build-userland.sh', 'cmake/**', 'ci/**', 'tests/**', 'overlay/**', '.github/workflows/build.yml', '.github/workflows/build-arch.yml']
  workflow_dispatch:
    inputs:
      fbsd_sha:
        description: 'Pinned FreeBSD SHA for the toolchain image tag (blank = latest)'
        required: false
        default: ''

jobs:
  # Host-native suites: the ones that need no CoreFoundation, so they can run
  # on the runner rather than only inside the booted image. autologin-user
  # decides whether the console logs somebody in with no password, and each of
  # its clauses is checked by mutation, so this is worth gating on.
  #
  # The account tool suites (adduser, passwd, rmuser, chpass, pw) are NOT here:
  # they link libds, which needs CoreFoundation, which the Ubuntu runners do
  # not have. Those run inside the image, from the ACCT markers.
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: autologin-user
        run: sh src/accounts/autologin-user/tests/autologin_test.sh
      # The directory commands are plain libc and every path they touch is a
      # build-time override, so they run here rather than only in the image.
      # They were not wired up before, which meant 199 lines of test and the
      # whole promote/demote/join/leave lifecycle had nothing running them.
      - name: directory commands
        run: sh src/directory/tests/ds_test.sh

  # --- Per-arch lanes (parallel, independent) ---
  amd64:
    uses: ./.github/workflows/build-arch.yml
    with:
      arch: amd64
      target_arch: amd64
      boot: true                 # x86 runner KVM-boots the amd64 image
      boot_soft: false           # GATING. A failed marker now fails the lane (#159).
                                 # The two markers this was waiting on are fixed: SYSLOG-RUN by the
                                 # aslmanager boot-stall removal (#143), IPCFG-ARP by surfacing its
                                 # result to the console. Both verified passing on amd64.
                                 #
                                 # This WILL be red until #158 is fixed -- scrltest and
                                 # test_libdispatch_mach both SIGSEGV in teardown AFTER passing, so
                                 # their success markers never reach the stream. That is the point:
                                 # a suite that reports green while two tests crash is worse than a
                                 # red one, and boot_soft was hiding exactly that.
      boot_gate: full            # boot -> login -> on-image Mach/launchd/configd suite
      fbsd_sha: ${{ github.event.client_payload.fbsd_sha || inputs.fbsd_sha }}
    secrets: inherit

  arm64:
    uses: ./.github/workflows/build-arch.yml
    with:
      arch: arm64
      target_arch: aarch64
      boot: true                 # qemu-system-aarch64 on a native arm64 runner
      boot_runner: ubuntu-24.04-arm
      boot_soft: false           # GATING -- see the amd64 note above (#159, blocked on #158).
      boot_gate: full            # post-login hang was getty std.9600 vs pl011 DCD (nextbsd#355), fixed by 3wire.9600 — run the full suite
      fbsd_sha: ${{ github.event.client_payload.fbsd_sha || inputs.fbsd_sha }}
    secrets: inherit

  publish:
    needs: [host-tests, amd64, arm64]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Gather artifacts
        run: |
          mkdir -p out
          find artifacts -name 'nextbsd-userland-*.tar.gz' -exec cp {} out/ \;
          ls -la out/
      - name: Publish to continuous release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous userland build
          prerelease: true
          fail_on_unmatched_files: true
          files: out/*.tar.gz
      # Cascade to the downstream consumers ONLY on a real upstream change,
      # after `continuous` is refreshed (mirrors compat/kernel). userland's
      # publish is the SINGLE producer that fans out to both the ISO builder
      # (nextbsd) and the package builder (nextbsd-pkg) — nextbsd-pkg is
      # triggered by userland-updated alone (maintainer decision; kernel/kext-only
      # changes use nextbsd-pkg's workflow_dispatch escape hatch).
      - name: Trigger downstream builds (nextbsd ISO + nextbsd-pkg packages)
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          SHA: ${{ github.event.client_payload.fbsd_sha }}
        run: |
          # The userland artifact is already published by now, so a downstream
          # repo the token cannot reach must not mark this build failed. Each
          # dispatch reports on its own and a miss becomes a warning.
          for repo in nextbsd/nextbsd nextbsd/nextbsd-pkg; do
            if gh api "repos/$repo/dispatches" \
                 -f event_type=userland-updated \
                 -f "client_payload[fbsd_sha]=$SHA"; then
              echo "dispatched userland-updated to $repo"
            else
              echo "::warning::could not dispatch userland-updated to $repo (DISPATCH_TOKEN may lack access); it will not rebuild against this userland"
            fi
          done
          exit 0
