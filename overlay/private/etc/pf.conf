#
# Default pf configuration file (NextBSD).
#
# Loaded at boot by org.nextbsd.pfctl (`pfctl -f /etc/pf.conf`). That loads
# these rules but does NOT enable pf, as Mac OS X's com.apple.pfctl does:
# pf stays off until something turns it on (`pfctl -e`, or later Internet
# Sharing). The kernel has pf compiled in.
#
# NextBSD features add their rules under the org.nextbsd anchors below, so
# they never touch this file. Put your own rules after the anchors.
#
# See pf.conf(5).
#
nat-anchor "org.nextbsd/*"
rdr-anchor "org.nextbsd/*"
anchor "org.nextbsd/*"
load anchor "org.nextbsd" from "/etc/pf.anchors/org.nextbsd"
